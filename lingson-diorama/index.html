<style>
body{margin:0;background:#F4F6FB}
a{color:#2340C8}a:hover{color:#182E96}
.dio-hit{position:absolute;padding:0;margin:0;border:none;background:transparent;cursor:pointer;font-family:inherit}
.dio-hit:hover .dio-shape{fill:#2340C8;fill-opacity:.14}
.dio-hit:focus-visible .dio-shape{fill:#2340C8;fill-opacity:.22;stroke:#182E96;stroke-width:4}
.dio-glow{animation:dio-glow 2s ease-in-out infinite}
.dio-in{animation:dio-in .5s ease both}
.dio-float{animation:dio-float 3.2s ease-in-out infinite}
@keyframes dio-glow{0%,100%{fill-opacity:.16}50%{fill-opacity:.32}}
@keyframes dio-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes dio-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion: reduce){.dio-glow,.dio-in,.dio-float{animation:none}}
.lk-in{animation:lk-fade .6s ease both}
.lk-out{animation:lk-fadeout .5s ease both}
.lk-dark{animation:lk-darkoff 2.6s ease both}
.lk-air{animation:lk-air 1.6s linear infinite}
.lk-ping{transform-box:fill-box;transform-origin:50% 50%;animation:lk-ping 1.4s ease-out infinite}
.lk-teeup2{animation:lk-teeup2 1s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes lk-fade{from{opacity:0}to{opacity:1}}
@keyframes lk-fadeout{from{opacity:1}to{opacity:0}}
@keyframes lk-darkoff{from{opacity:.9}to{opacity:0}}
@keyframes lk-air{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(40px);opacity:0}}
@keyframes lk-ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
@keyframes lk-teeup2{from{transform:translateY(56px)}to{transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){.lk-air,.lk-ping{animation:none}.lk-in,.lk-out,.lk-dark,.lk-teeup2{animation-duration:.01s;animation-delay:0s !important}}
</style>
